# Monta o APK do app Embaixada e publica em Releases.
name: APK da Embaixada

on:
  push:
    branches: [ccr-07b648c6-d6hc6d]
    paths:
      - 'android-embaixada/**'
      - '.github/workflows/apk-embaixada.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-embaixada
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Gerar o projeto Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#10151F' --iconBackgroundColorDark '#10151F' --splashBackgroundColor '#10151F' --splashBackgroundColorDark '#10151F'
          npx cap sync android

      - name: Montar o APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      # Cada montagem cria uma chave nova que não é salva. Por isso, pra instalar um APK novo, desinstale o antigo antes.
      - name: Assinar o APK
        run: |
          SENHA=$(openssl rand -hex 16)
          keytool -genkeypair -keystore chave.keystore -storepass "$SENHA" -keypass "$SENHA" -alias embaixada -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Embaixada, O=ResenhaCraft, C=BR"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk alinhado.apk
          "$BT/apksigner" sign --ks chave.keystore --ks-pass "pass:$SENHA" --key-pass "pass:$SENHA" --ks-key-alias embaixada --out Embaixada.apk alinhado.apk
          rm chave.keystore
          "$BT/apksigner" verify --verbose Embaixada.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Embaixada-apk
          path: android-embaixada/Embaixada.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: embaixada-${{ github.run_number }}
          name: Embaixada (APK) ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: android-embaixada/Embaixada.apk
          body: |
            Baixe o arquivo **Embaixada.apk** no celular Android e toque nele pra instalar.
            Se o Android pedir, permita instalar apps desta fonte.
            Já tem uma versão antiga? Desinstale antes de instalar esta.
